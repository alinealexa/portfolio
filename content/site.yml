marca:
  nome: "aa. creative studio"
  dominio: "aacreativestudio.com"

seo:
  titulo: "aa. creative studio"
  descricao: >-
    Studio de branding e comunicação com base em design e obsessão por
    consistência. Posicionamento, identidade e comunicação para negócios
    que querem crescer com consistência.
  idioma: "pt-BR"

hero:
  linhas:
    - "creative"
    - "studio"
  # Vídeo por dentro das letras. Arquivo em content/media/.
  # Vazio = título sólido.
  video: ""
  frase: >-
    Marcas relevantes começam com um bom design. Construímos posicionamento,
    identidade e comunicação para negócios que querem crescer com consistência.
  desde: "2017"

# Use **assim** para grifar um trecho na cor azul da marca.
# O ponto final vira um círculo laranja automaticamente.
manifesto: >-
  Somos um studio focado em **soluções criativas** para o crescimento do seu
  negócio através da consolidação de **marcas fortes** e **consistentes**.

# ------------------------------------------------------------
# SOBRE — aparece logo abaixo do manifesto, na seção Studio
# ------------------------------------------------------------
sobre:
  texto: >-
    Traçamos estratégias assertivas para atingir o seu público de interesse e
    construímos mensagens claras e relevantes para fidelizar os seus clientes.
    Nossa expertise se concentra em marcas orientadas por propósito, com ênfase
    no mercado de saúde e bem-estar esportivo, conectando criatividade, dados
    e performance.
  pessoa:
    nome: "Aline Alexa"
    cargo: "Diretora criativa"
    bio: >-
      Formada em Design pela ESPM, são 10 anos de marketing e construção
      estratégica de marcas, com passagem por moda, branding e esportes. Foram
      quatro anos na Ambev, liderando projetos de comunicação e inovação em uma
      das maiores estruturas de marketing do mundo, e os últimos três anos na
      gestão de marketing de marcas esportivas globais como a Polar. Também
      empreende há três anos na intersecção entre design e esporte com o
      aa.sports, negócio independente do studio.
  # Link para o outro negócio
  extra:
    label: "aa.sports"
    desc: "Negócio independente, na intersecção entre design e esporte."
    url: ""

