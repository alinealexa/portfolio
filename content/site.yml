# ÁREAS DE ATUAÇÃO
# ------------------------------------------------------------
areas_intro: >-
  Trabalhamos em quatro frentes que se conversam: estratégia, identidade,
  comunicação e performance. Elas podem vir juntas ou separadas, e o escopo
  se ajusta ao momento do negócio.

areas:
  - nome: "Branding"
    itens:
      - "Posicionamento de marca"
      - "Arquitetura de marca"
      - "Plataforma de marca (propósito, visão, valores)"
      - "Cenários para inovação"
      - "Pesquisa de mercado"
      - "Pesquisa com consumidor"
      - "Persona e jornada"
      - "Territórios de comunicação"
      - "Tom de voz"

  - nome: "Design"
    itens:
      - "Logo"
      - "Paleta cromática"
      - "Paleta tipográfica"
      - "Iconografia"
      - "Estilo fotográfico"
      - "Estilo de ilustração"
      - "Material promocional"
      - "Elementos gráficos"
      - "Aplicações de marca"

  - nome: "Plano de marketing"
    itens:
      - "Análise da concorrência"
      - "Definição de objetivos e KPIs"
      - "Mapeamento de territórios de comunicação"
      - "Definição de canais de comunicação"
      - "Criação de pautas e cronograma de conteúdos para redes sociais"
      - "Agendamento de postagens"
      - "Mapeamento de experiências para consumidores"

  - nome: "Performance"
    itens:
      - "Orçamento de investimento para mídia paga"
      - "Gestão e monitoramento de mídia"
      - "Estratégia de collabs"
      - "Mapeamento de influenciadores"
      - "Análise de métricas"

