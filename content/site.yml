# ------------------------------------------------------------
# METODOLOGIA — duplo diamante + acordeão
# Cada etapa diverge ou converge; é isso que desenha o diagrama.
# ------------------------------------------------------------
metodologia:
  intro: >-
    A metodologia é um dos nossos principais pilares como studio. Entendemos
    que é crucial para solucionar problemas e desenvolver entregas inovadoras.
  texto: >-
    Nossa metodologia oferece diretrizes e etapas estruturadas para alcançar
    resultados desejados de forma consistente, de acordo com o cenário
    individualizado dos nossos clientes. Nossa abordagem é centrada nas pessoas
    e enfatiza a compreensão dos usuários e a criação de soluções que atendam às
    suas necessidades. Promovemos a criatividade, a colaboração e o foco no
    cliente final, levando a resultados eficazes e impactantes.
  etapas:
    - nome: "Imersão"
      movimento: "divergir"
      desc: >-
        Mergulhamos no negócio, no mercado e no consumidor. Benchmark,
        entrevistas e leitura do cenário atual da marca.
      entrega: "Diagnóstico de marca e análise da concorrência"

    - nome: "Síntese"
      movimento: "convergir"
      desc: >-
        Transformamos o volume de informação em direção. Definimos o problema
        real a ser resolvido e os territórios onde a marca pode jogar.
      entrega: "Plataforma de marca: propósito, posicionamento, persona e tom de voz"

    - nome: "Experimentação"
      movimento: "divergir"
      desc: >-
        Exploramos caminhos criativos, testamos rotas de identidade e
        comunicação antes de fechar qualquer decisão.
      entrega: "Rotas criativas apresentadas e uma escolhida em conjunto"

    - nome: "Entrega"
      movimento: "convergir"
      desc: >-
        Refinamos a rota escolhida e construímos o sistema completo, pronto
        para rodar.
      entrega: "Identidade visual, manual de aplicação e plano de comunicação"

